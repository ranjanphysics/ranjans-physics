<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Material | Ranjan's Physics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#122a52;--blue:#1677d2;--muted:#68758a;--line:#e3e8f0;
  --bg:#f7f9fc;--white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17233b}
.container{width:min(1120px,92%);margin:auto}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 0;position:sticky;top:0;z-index:5}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-weight:900;color:var(--navy);font-size:20px}
.back{display:inline-flex;padding:10px 14px;border-radius:10px;background:#eef5ff;color:var(--blue);font-weight:800;text-decoration:none}
main{padding:55px 0 80px}
.tag{font-size:12px;letter-spacing:2px;font-weight:900;color:var(--blue);text-transform:uppercase}
h1{font-size:clamp(32px,5vw,52px);margin:10px 0;color:var(--navy)}
.lead{color:var(--muted);font-size:16px}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}
select{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px rgba(18,42,82,.05)}
.card h3{margin:0 0 8px;color:var(--navy);font-size:18px}
.meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;padding:9px 12px;border-radius:9px;background:var(--blue);color:#fff;text-decoration:none;font-size:12px;font-weight:900}
.empty{background:#fff;border:1px dashed var(--line);padding:30px;border-radius:16px;color:var(--muted)}
.subject{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 25px rgba(18,42,82,.05)}
.subject-heading{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.subject-heading h2{margin:0;color:var(--navy);font-size:25px}
.subject-badge{font-size:11px;letter-spacing:1px;font-weight:900;color:var(--blue);background:#eef5ff;padding:8px 10px;border-radius:8px}
.chapter{border-top:1px solid var(--line);padding:20px 0 4px}
.chapter:first-child{border-top:0;padding-top:0}
.chapter h3{margin:0 0 14px;color:var(--navy);font-size:19px}
.lecture-list{display:grid;gap:10px}
.lecture{display:flex;align-items:center;justify-content:space-between;gap:15px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lecture-title{font-weight:800;color:#243552;line-height:1.4}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.pdf{background:var(--blue)}
.btn.video{background:#122a52}
@media(max-width:650px){.lecture{align-items:flex-start;flex-direction:column}.subject{padding:18px}}

@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.header-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
<div class="container header-row">
<div class="logo">Ranjan's Physics</div>
<a class="back" href="index.html">← Back to Home</a>
</div>
</header>

<main>
<div class="container">
<div class="tag">Student Resources</div>
<h1 id="pageTitle">Study Material</h1>
<p class="lead">Class-wise notes, PDFs, important questions and learning videos.</p>

<div class="filter">
<select id="classFilter" aria-label="Select class">
<option value="Class 9">Class 9</option>
<option value="Class 10">Class 10</option>
<option value="Class 11">Class 11</option>
<option value="Class 12">Class 12</option>
</select>
</div>

<div id="materialGrid" class="grid">
<div class="empty">Loading study material...</div>
</div>
</div>
</main>

<script>
const SUPABASE_URL="https://jeahylkdcuxkybgcjycs.supabase.co";
const SUPABASE_KEY="sb_publishable_RqSEKI8mif1Wqftf0KJAZA_tX07MrgW";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const initialClass=params.get("class");
const allowed=["Class 9","Class 10","Class 11","Class 12"];
// Admin panel currently stores classes as: 9th, 10th, 11th, 12th.
// Keep the public URL/UI as "Class 9" etc., but query the actual database values.
const dbClassMap={
  "Class 9":"9th",
  "Class 10":"10th",
  "Class 11":"11th",
  "Class 12":"12th"
};
const filter=document.getElementById("classFilter");
const grid=document.getElementById("materialGrid");
const title=document.getElementById("pageTitle");

if(allowed.includes(initialClass)) filter.value=initialClass;

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function loadMaterials(){
 const cls=filter.value;
 const dbClass=dbClassMap[cls] || cls;
 title.textContent=cls+" Study Material";
 grid.innerHTML='<div class="empty">Loading study material...</div>';

 const {data,error}=await supabaseClient
   .from("study_materials")
   .select("id,title,class_name,subject,chapter,pdf_url,youtube_url,published")
   .eq("published",true)
   .in("class_name",[dbClass,cls])
   .order("id",{ascending:true});

 if(error){
   console.error(error);
   grid.innerHTML='<div class="empty">Study material could not be loaded right now.</div>';
   return;
 }

 if(!data?.length){
   grid.innerHTML='<div class="empty">No published study material is available for '+esc(cls)+' yet. Please check again soon.</div>';
   return;
 }

 // Build:
 // Subject
 //   -> Chapter
 //      -> Lecture 01 / 02 / ...
 //         -> PDF + Video
 const subjects={};

 data.forEach(item=>{
   const subject=item.subject || "Physics";
   const chapter=item.chapter || "General";
   if(!subjects[subject]) subjects[subject]={};
   if(!subjects[subject][chapter]) subjects[subject][chapter]=[];
   subjects[subject][chapter].push(item);
 });

 let subjectNumber=0;

 grid.innerHTML=Object.entries(subjects).map(([subject,chapters])=>{
   subjectNumber++;

   const chapterHtml=Object.entries(chapters).map(([chapter,items])=>{
     const lectureHtml=items.map((item,index)=>{
       const lectureNo=String(index+1).padStart(2,"0");
       const pdf=item.pdf_url
         ? '<a class="btn pdf" href="'+esc(item.pdf_url)+'" target="_blank" rel="noopener">📄 PDF</a>'
         : '';
       const yt=item.youtube_url
         ? '<a class="btn video" href="'+esc(item.youtube_url)+'" target="_blank" rel="noopener">▶ Video</a>'
         : '';

       return '<div class="lecture">'+
         '<div class="lecture-title">Lecture '+lectureNo+
         (item.title ? ' — '+esc(item.title) : '')+
         '</div>'+
         '<div class="actions">'+(pdf+yt||'<span class="meta">Resource coming soon</span>')+'</div>'+
       '</div>';
     }).join("");

     return '<section class="chapter">'+
       '<h3>📚 '+esc(chapter)+'</h3>'+
       '<div class="lecture-list">'+lectureHtml+'</div>'+
     '</section>';
   }).join("");

   return '<section class="subject">'+
     '<div class="subject-heading">'+
       '<span class="subject-badge">SUBJECT '+subjectNumber+'</span>'+
       '<h2>'+esc(subject)+'</h2>'+
     '</div>'+
     '<div class="chapters">'+chapterHtml+'</div>'+
   '</section>';
 }).join("");
}

filter.addEventListener("change",()=>{
 const cls=filter.value;
 history.replaceState(null,"","material.html?class="+encodeURIComponent(cls));
 loadMaterials();
});
loadMaterials();
</script>
</body>
</html>
